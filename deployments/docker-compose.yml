name: sigryx

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigryx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigryx
      POSTGRES_PASSWORD: sigryx
      POSTGRES_DB: sigryx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigryx -d sigryx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
